<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>My Contacts</title>
  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
    crossorigin="anonymous"
  >
  <link rel="stylesheet" href="css/contacts.css">
</head>

<body>
  <!-- Navigation bar -->
  <nav class="navbar navbar-dark bg-primary">
    <div class="container">
      <span class="navbar-brand">
        Contact Manager
      </span>

      <div class="d-flex align-items-center gap-3">
        <span id="welcome-user" class="text-white">
          Welcome
        </span>

        <button id="logout-button" class="btn btn-outline-light" type=""button>
          Logout
        </button>
      </div>
    </div>
  </nav>

  <!-- Main -->
  <main class="container py-4">

    <!-- Heading -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h1>My Contacts</h1>
        <p class="text-muted mb-0">
          Manage your contacts
        </p>
      </div>

      <button
        id="add-contact-button"
        class="btn btn-primary"
        type="button"
        data-bs-toggle="modal"
        data-bs-target="#contact-modal"
      >
        + Add Contact
      </button>
    </div>

    <!-- Search -->
    <div class="mb-4">
      <label for="search-input" class="form-label">
        Search contacts
      </label>

      <input
        id="search-input"
        class="form-control"
        type="search"
        placeholder="Search by name, email, or phone..."
      >
    </div>

    <!-- Contacts table -->
    <div class="card">
      <div class="card-body">

        <div class="table-responsive">
          <table class="table table-hover align-middle">

            <thead>
              <tr>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Phone</th>
                <th>Email</th>
                <th>Company</th>
                <th class="text-end">Actions</th>
              </tr>
            </thead>

            <tbody id="contacts-table-body">
              <!-- JavaScript inserts -->
            </tbody>
          </table>
        </div>

      </div>
    </div>

  </main>


  <!-- Add/Edit Contact Modal -->
  <div
    class="modal fade"
    id="contact-modal"
    tabindex="-1"
    aria-labelledby="contact-modal-label"
    aria-hidden="true"
  >

    <div class="modal-dialog">

      <div class="modal-content">

        <div class="modal-header">
          <h2 class="modal-title fs-5" id="contact-modal-label">
            Add Contact
          </h2>

          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
            aria-label="Close"
          ></button>
        </div>

        <form id="contact-form">

          <div class="modal-body">

            <!-- First name -->
            <div class="mb-3">
              <label
                for="contact-fname"
                class="form-label"
              >
                First Name
              </label>

              <input
                id="contact-fname"
                class="form-control"
                type="text"
                required
              >
            </div>

            <!-- Last name -->
            <div class="mb-3">
              <label
                for="contact-lname"
                class="form-label"
              >
                Last Name
              </label>

              <input
                id="contact-lname"
                class="form-control"
                type="text"
                required
              >
            </div>

            <!-- Phone -->
            <div class="mb-3">
              <label
                for="contact-phone"
                class="form-label"
              >
                Phone
              </label>

              <input
                id="contact-phone"
                class="form-control"
                type="tel"
              >
            </div>
            
            <!-- Email -->
            <div class="mb-3">
              <label
                for="contact-email"
                class="form-label"
              >
                Email
              </label>

              <input
                id="contact-email"
                class="form-control"
                type="email"
              >
            </div>

            <!-- Company -->
            <div class="mb-3">
              <label
                for="contact-company"
                class="form-label"
              >
                Company
              </label>

              <input
                id="contact-company"
                class="form-control"
                type="text"
              >
            </div>

          </div>


          <div class="modal-footer">

            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>

            <button
              type="submit"
              class="btn btn-primary"
            >
              Save Contact
            </button>

          </div>

        </form>

      </div>

    </div>

  </div>

  <!-- Bootstrap/JavaScript -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
  ></script>
  <script src="js/contacts.js"></script>

</body>
</html>
