<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Contact Manager</title>
  
    <link rel="stylesheet" href="css/auth.css">
    <script src = "js/auth.js"></script>
  </head>

  <body>
    <main class="auth-page">
      <h1>Contact Manager</h1>
      <!-- Buttons for switching between login or registor form-->
      <div class = "form-selector">
        <button id="show-login-button" type="button" aria-pressed="true">
          Login
        </button>

        <button id="show-register-button" type="button" aria-pressed="false">
          Register
        </button>
      </div>

      <!-- Login form -->
       <form id="login-form">
        <h2>Log in</h2>
        
        <label for="login-username">Username</label>
        <input
          type="text"
          id="login-username"
          name="username"
          autocomplete="username"
          required
        >
        
        <label for="login-password">Password</label>
        <input
          type="password"
          id="login-password"
          name="password"
          autocomplete="current-password"
          required
        >
        
        <button type="submit">Login</button>
       </form>

       <!-- Registration form(stays hidden until selected) -->
      <form id="register-form" hidden>
        <h2>Create an Account</h2>

        <label for="register-username">Username</label>
        <input
          type="text"
          id="register-username"
          name="username"
          autocomplete="username"
          required
        >

        <label for="register-password">Password</label>
        <input
          type="password"
          id="register-password"
          name="password"
          autocomplete="new-password"
          required
        >
        <button type="submit">Create Account</button>
      </form>
    </main>
  </body>
</html>
