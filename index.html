<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Contact Manager</title>
    <!-- Bootstrap CSS -->
    <link 
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
      rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"   crossorigin="anonymous"
    >
    <link rel="stylesheet" href="css/auth.css">
  </head>

  <body>
    <main class="auth-page">
      <section class="auth-card">
        <h1 class="auth-title">Contact Manager</h1>
        
        <!-- Buttons for switching between login or registor form-->
        <div class = "form-selector">
          <button 
            id="show-login-button"
            class="btn btn-outline-primary"
            type="button" 
            aria-pressed="true"
          >
            Login
          </button>

          <button 
            id="show-register-button" 
            class="btn btn-outline-primary"
            type="button" 
            aria-pressed="false"
          >
            Register
          </button>
        </div>

        <!-- Login form -->
        <form id="login-form" class="auth-form">
          <h2>Log in</h2>

          <div class="form-group">
            <label class="form-label" for="login-username">Username</label>
          
          
          <input
            class="form-control"
            type="text"
            id="login-username"
            name="username"
            autocomplete="username"
            required
          >
          </div>

          <div class="form-group">
            <label class="form-label" for="login-password">Password</label>
          
            <input
              class="form-control"
              type="password"
              id="login-password"
              name="password"
              autocomplete="current-password"
              required
            >
          </div>

          <button class="btn btn-primary submit-button" type="submit">Login</button>
        </form>

        <!-- Registration form(stays hidden until selected) -->
        <form id="register-form" class="auth-form" hidden>
          <h2>Create an Account</h2>
          
          <div class="form-group">
            <label class="form-label" for="register-username">Username</label>

            <input
              class="form-control"
              type="text"
              id="register-username"
              name="username"
              autocomplete="username"
              required
            >
          </div>

          <div class="form-group">
            <label class="form-label" for="register-password">Password</label>
          
            <input
              class="form-control"
              type="password"
              id="register-password"
              name="password"
              autocomplete="new-password"
              required
            >
          </div>

          <button class="btn btn-primary submit-button" type="submit">Create Account</button>
        </form>
      </section>
    </main>
    <script src = "js/auth.js"></script>
  </body>
</html>
